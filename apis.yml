aid: datastax
name: DataStax
description: 'DataStax is the company behind Astra DB, a serverless, multi-cloud database
  and vector-search platform built on Apache Cassandra, along with Langflow, RAGStack,
  and the Astra Streaming (Apache Pulsar) event platform for building generative-AI and
  real-time applications. Developers interact with Astra DB through the Data API (JSON
  document, table, and vector operations), the legacy REST, Document, and GraphQL APIs,
  and the Astra DevOps API for programmatic administration of databases, keyspaces,
  access lists, roles, users, tokens, private links, and CDC. DataStax publishes official
  client SDKs (Python astrapy, TypeScript astra-db-ts, Go astra-db-go), the Java-based
  Astra CLI, and an official Astra DB Model Context Protocol (MCP) server for agentic
  access. DataStax was acquired by IBM in 2025 and its Astra products are now part of
  the IBM watsonx data portfolio, while the developer surface remains hosted on
  datastax.com, docs.datastax.com, astra.datastax.com, and github.com/datastax.'
